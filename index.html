
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RMR Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#0f172a;--surface:#1e293b;--surface2:#273548;--border:#334155;--accent:#22c55e;--yellow:#facc15;--red:#f87171;--text:#f1f5f9;--muted:#94a3b8;--radius:12px}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px 16px 60px}
    header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:24px}
    .logo{display:flex;align-items:center;gap:10px}
    .logo-icon{width:40px;height:40px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
    h1{font-size:20px;font-weight:700} h1 span{color:var(--accent)}
    .header-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    select,input[type=number]{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 10px;font-size:13px;outline:none}
    select:focus,input[type=number]:focus{border-color:var(--accent)}
    .dias-wrap{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:4px 10px}
    .dias-wrap label{font-size:12px;color:var(--muted);white-space:nowrap}
    .dias-wrap input{border:none;background:none;width:44px;padding:3px 4px;font-size:13px;color:var(--text)}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
    .card-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:opacity .15s,transform .1s;font-family:inherit}
    .btn:active{transform:scale(.98)} .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn-primary{background:var(--accent);color:#0f172a} .btn-primary:hover:not(:disabled){background:#4ade80}
    .btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)} .btn-secondary:hover{background:var(--border)}
    .btn-import{background:var(--surface);border:1.5px solid var(--accent);color:var(--accent);padding:7px 14px;font-size:13px;font-weight:600;border-radius:8px;cursor:pointer;font-family:inherit;transition:all .15s}
    .btn-import:hover{background:rgba(34,197,94,.1)}
    .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

    /* Agent cards */
    .agent-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
    .agent-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);background:var(--surface2)}
    .agent-name{font-size:15px;font-weight:700}
    .agent-sub{font-size:11px;color:var(--muted);margin-top:2px}
    .score-chip{font-size:16px;font-weight:800;padding:4px 12px;border-radius:20px}
    .score-green{background:rgba(34,197,94,.15);color:var(--accent)}
    .score-yellow{background:rgba(250,204,21,.15);color:var(--yellow)}
    .score-red{background:rgba(248,113,113,.15);color:var(--red)}
    .agent-body{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
    .section-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:6px;margin-bottom:2px}

    /* KPI bars (Supabase) */
    .kpi-bar-row{display:flex;flex-direction:column;gap:4px}
    .kpi-bar-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .kpi-bar-name{font-size:12px;font-weight:600}
    .kpi-bar-vals{font-size:11px;color:var(--muted)}
    .kpi-bar-vals span{color:var(--text);font-weight:600}
    .bar-track{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
    .bar-fill{height:100%;border-radius:3px;transition:width .4s}

    /* Extra KPI rows */
    .extra-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
    .extra-row:last-child{border-bottom:none;padding-bottom:0}
    .extra-left{flex:1;min-width:0}
    .extra-name{font-size:12px;font-weight:600}
    .extra-rate{font-size:11px;color:var(--muted);margin-top:2px}
    .extra-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
    .kpi-input{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 8px;font-size:13px;width:80px;text-align:right}
    .kpi-input:focus{border-color:var(--accent);outline:none}

    /* Badges */
    .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
    .badge-green{background:rgba(34,197,94,.15);color:var(--accent)}
    .badge-yellow{background:rgba(250,204,21,.15);color:var(--yellow)}
    .badge-red{background:rgba(248,113,113,.15);color:var(--red)}
    .badge-gray{background:var(--surface2);color:var(--muted)}

    /* Summary row */
    .summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
    .stat-card{background:var(--surface2);border-radius:10px;padding:12px}
    .stat-label{font-size:11px;color:var(--muted);margin-bottom:4px}
    .stat-value{font-size:22px;font-weight:800}
    .stat-sub{font-size:11px;color:var(--muted);margin-top:2px}
    .c-green{color:var(--accent)} .c-yellow{color:var(--yellow)} .c-red{color:var(--red)}

    /* AI */
    .step-box{background:var(--surface2);border-radius:10px;padding:14px;margin-bottom:12px}
    .step-num{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:4px}
    .step-desc{font-size:13px;color:var(--muted);margin-bottom:10px}
    textarea{width:100%;min-height:100px;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;resize:vertical;outline:none}
    textarea:focus{border-color:var(--accent)}
    .ai-section{display:none} .ai-section.visible{display:block}
    .divider{height:1px;background:var(--border);margin:12px 0}
    #ai-output{font-size:14px;line-height:1.7;white-space:pre-wrap}
    .error-msg{color:var(--red);font-size:12px;margin-top:6px;display:none}
    .info-msg{color:var(--accent);font-size:12px;margin-top:6px;display:none}
    .spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Empty state */
    .empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
    .empty-state h3{color:var(--text);font-size:15px;margin-bottom:6px}

    /* Export */
    #export-preview{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;overflow-y:auto;padding:20px}
    #export-preview.open{display:flex;align-items:flex-start;justify-content:center}
    #export-doc{background:#fff;color:#1a1a1a;max-width:760px;width:100%;border-radius:12px;padding:48px;font-family:Georgia,serif}
    #export-doc h2{font-size:26px;font-weight:700;margin-bottom:4px;color:#111}
    #export-doc .doc-sub{font-size:13px;color:#666;margin-bottom:28px;font-family:sans-serif}
    #export-doc h3{font-size:14px;font-weight:700;margin:20px 0 8px;color:#111;border-bottom:1px solid #eee;padding-bottom:4px;font-family:sans-serif}
    #export-doc h4{font-size:13px;font-weight:700;margin:16px 0 8px;color:#333;font-family:sans-serif}
    #export-doc table{width:100%;border-collapse:collapse;font-family:sans-serif;font-size:12px;margin-bottom:12px}
    #export-doc th{background:#f5f5f5;padding:6px 10px;text-align:left;font-weight:600;color:#555;border-bottom:2px solid #e5e5e5}
    #export-doc td{padding:6px 10px;border-bottom:1px solid #f0f0f0}
    #export-doc .doc-analysis{font-family:sans-serif;font-size:13px;line-height:1.8;white-space:pre-wrap;color:#333;background:#f9fafb;padding:16px;border-radius:8px;margin-top:8px}
    #export-doc .doc-footer{margin-top:36px;font-size:11px;color:#aaa;font-family:sans-serif;text-align:center}
    #export-doc .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
    #export-doc .dot-g{background:#22c55e} #export-doc .dot-y{background:#facc15} #export-doc .dot-r{background:#f87171}
    .close-preview{position:sticky;top:0;display:flex;justify-content:flex-end;gap:8px;margin-bottom:-10px;padding:8px;z-index:10}
    .close-preview button{background:var(--surface2);border:none;color:var(--text);padding:7px 14px;border-radius:7px;cursor:pointer;font-size:13px;font-family:inherit}
    @media print{body>*:not(#export-preview){display:none!important} #export-preview{display:block!important;position:static!important;background:none;padding:0} #export-doc{box-shadow:none;border-radius:0;padding:0} .close-preview{display:none}}
    .agent-ai-toggle{border-top:1px solid var(--border);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .agent-ai-body{display:none;padding:14px 18px 16px;border-top:1px solid var(--border);background:var(--surface2)}
    .agent-ai-body.open{display:block}
    .agent-saved-analysis{margin-top:12px;font-size:13px;line-height:1.7;white-space:pre-wrap;border-top:1px solid var(--border);padding-top:12px}

    /* ── TPV M-1 por Cliente ─────────────────────────────────────── */
    .tpv-toggle{border-top:1px solid var(--border);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;user-select:none}
    .tpv-toggle:hover{background:var(--surface2)}
    .tpv-body{display:none;padding:0 18px 16px;border-top:1px solid var(--border)}
    .tpv-body.open{display:block}
    .tpv-summary-pills{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 10px}
    .tpv-pill{display:flex;align-items:center;gap:5px;background:var(--surface2);border-radius:20px;padding:4px 10px;font-size:11px;font-weight:600}
    .tpv-pill-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    .tpv-table{width:100%;border-collapse:collapse;font-size:12px}
    .tpv-table th{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--border);text-align:left}
    .tpv-table th:nth-child(2),.tpv-table th:nth-child(3),.tpv-table th:nth-child(4){text-align:right}
    .tpv-table td{padding:7px 8px;border-bottom:1px solid rgba(51,65,85,.5);vertical-align:middle}
    .tpv-table td:nth-child(2),.tpv-table td:nth-child(3),.tpv-table td:nth-child(4){text-align:right;font-family:monospace;font-size:11px}
    .tpv-table tr:last-child td{border-bottom:none}
    .tpv-table tr:hover td{background:rgba(255,255,255,.02)}
    .tpv-mini-bar{height:4px;border-radius:2px;margin-top:3px;max-width:100%}
    .tpv-name{font-weight:600;font-size:12px}
    .tpv-upload-area{margin-top:12px;border:1.5px dashed var(--border);border-radius:10px;padding:14px;text-align:center}
    .tpv-upload-area p{font-size:12px;color:var(--muted);margin-bottom:8px}
    .tpv-file-input{display:none}
    .tpv-geral-row{background:var(--surface2);font-weight:700}
    .tpv-geral-row td{border-top:1px solid var(--border)!important;border-bottom:none!important}
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">&#128202;</div>
    <div>
      <h1>RMR <span>Dashboard</span></h1>
      <div style="font-size:11px;color:var(--muted)">Reuni&#227;o Mensal de Resultado &mdash; Stone Barbacena</div>
    </div>
  </div>
  <div class="header-controls">
    <select id="month-select">
      <option value="1">Janeiro</option><option value="2">Fevereiro</option>
      <option value="3">Mar&#231;o</option><option value="4">Abril</option>
      <option value="5">Maio</option><option value="6">Junho</option>
      <option value="7">Julho</option><option value="8">Agosto</option>
      <option value="9">Setembro</option><option value="10">Outubro</option>
      <option value="11">Novembro</option><option value="12">Dezembro</option>
    </select>
    <select id="year-select"></select>
    <div class="dias-wrap">
      <label>Dias &#250;teis</label>
      <input type="number" id="dias-uteis" value="22" min="1" max="31" onchange="onDiasUteis()" oninput="onDiasUteis()" />
    </div>
    <button class="btn-import" id="btn-import" onclick="importarDoSupabase()">&#8635; Importar do Dash de Metas</button>
  </div>
</header>

<!-- Resumo do time -->
<div class="card" id="summary-card" style="display:none">
  <div class="card-title">Vis&#227;o Geral do Time</div>
  <div class="summary-grid" id="summary-grid"></div>
</div>

<!-- Agent cards -->
<div id="agents-container">
  <div class="card empty-state">
    <h3>Nenhum dado carregado</h3>
    <p>Selecione o m&#234;s, defina os dias &#250;teis e clique em <strong style="color:var(--accent)">Importar do Dash de Metas</strong>.</p>
  </div>
</div>

<!-- Relatório do time completo -->
<div class="card">
  <div class="card-title">Relat&#243;rio Geral do Time</div>
  <p style="font-size:13px;color:var(--muted);margin-bottom:12px">Exporta a tabela completa com todos os agentes e KPIs.</p>
  <button class="btn btn-secondary" onclick="openExport()">&#128196; Relat&#243;rio do Time (PDF)</button>
</div>

<!-- Export modal -->
<div id="export-preview">
  <div style="width:100%;max-width:760px">
    <div class="close-preview">
      <button onclick="window.print()" style="background:var(--accent);color:#0f172a;font-weight:700">&#128424; Imprimir / PDF</button>
      <button onclick="closeExport()">&#10005; Fechar</button>
    </div>
    <div id="export-doc"></div>
  </div>
</div>

<script>
// ── Supabase ──────────────────────────────────────────────────────────────────
const SUPA_URL = 'https://cyseabealxbtwubvhyrh.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5c2VhYmVhbHhidHd1YnZoeXJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNzkwNzgsImV4cCI6MjA5Mzc1NTA3OH0.eHXjTtjyCf7fYusZhUJmRh9sKWe5tNGXGI06tVjbjeM';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

// ── Thresholds ────────────────────────────────────────────────────────────────
const TH = {
  propostas:     { otimo: 2,     bom: 1.5   },
  tarefasTotais: { otimo: 10,    bom: 7     },
  tarefasVendas: { otimo: 7,     bom: 5     },
  td:            { otimo: 0.30,  bom: 0.15  },
  reunioes:      { otimo: 9,     bom: 6     },
  tpvMedio:      { otimo: 30000, bom: 20000 }
};

const TRILHAS = { 600:'Aspira', 1200:'Agente 1', 1700:'Agente 2', 2000:'Agente 3', 2400:'Agente 4' };
const MESES   = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

// ── State ─────────────────────────────────────────────────────────────────────
var agentes = [], extras = {}, aiAnalysis = '';
// tpvClientes: { [agId]: [ {nome, realizado, precificado} ] }
var tpvClientes = {};

// ── Utils ─────────────────────────────────────────────────────────────────────
function getMesChave() {
  var y = document.getElementById('year-select').value;
  var m = String(document.getElementById('month-select').value).padStart(2,'0');
  return y + '_' + m;
}
function getDU() { return Math.max(1, Number(document.getElementById('dias-uteis').value) || 22); }
function getMesLabel() {
  var m = document.getElementById('month-select');
  return m.options[m.selectedIndex].text + ' / ' + document.getElementById('year-select').value;
}
function classify(val, th) {
  if (val >= th.otimo) return 'otimo';
  if (val >= th.bom)   return 'bom';
  return 'ruim';
}
function filled(ex, field) {
  var v = ex[field];
  return v !== '' && v !== null && v !== undefined;
}
function badgeHtml(status, id) {
  var map = { otimo:['badge-green','Ótimo'], bom:['badge-yellow','Bom'], ruim:['badge-red','Ruim'], null:['badge-gray','—'] };
  var arr = map[status] || map[null];
  var idAttr = id ? ' id="'+id+'"' : '';
  return '<span class="badge '+arr[0]+'"'+idAttr+'>'+arr[1]+'</span>';
}
function scoreClass(s) { return s>=100?'score-green':s>=50?'score-yellow':'score-red'; }
function scoreColor(s) { return s>=100?'c-green':s>=50?'c-yellow':'c-red'; }
function fmtBRL(v) { return 'R$ ' + Number(v).toLocaleString('pt-BR', {minimumFractionDigits:0, maximumFractionDigits:0}); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtMd(t) {
  var tmp = "", rest = t, i1, i2;
  while ((i1 = rest.indexOf("**")) !== -1) {
    i2 = rest.indexOf("**", i1 + 2);
    if (i2 === -1) break;
    tmp += rest.substring(0, i1) + "<strong>" + rest.substring(i1+2, i2) + "</strong>";
    rest = rest.substring(i2 + 2);
  }
  t = tmp + rest;
  var lines = t.split("\n"), out = [], inList = false;
  for (var j = 0; j < lines.length; j++) {
    var l = lines[j];
    if (l.substring(0,4) === "### ") { if(inList){out.push("</ul>");inList=false;} out.push("<h4 style='margin:14px 0 4px;font-size:13px;color:var(--accent)'>" + l.substring(4) + "</h4>"); continue; }
    if (l.substring(0,3) === "## ") { if(inList){out.push("</ul>");inList=false;} out.push("<h3 style='margin:16px 0 6px;font-size:15px;font-weight:700'>" + l.substring(3) + "</h3>"); continue; }
    if (l.substring(0,2) === "# ") { if(inList){out.push("</ul>");inList=false;} out.push("<h2 style='margin:18px 0 8px;font-size:17px;font-weight:700'>" + l.substring(2) + "</h2>"); continue; }
    if (l.length > 2 && l[1] === "." && l[2] === " ") { if(inList){out.push("</ul>");inList=false;} out.push("<p style='margin:10px 0 4px'>" + l + "</p>"); continue; }
    if (l.length > 3 && l[2] === "." && l[3] === " ") { if(inList){out.push("</ul>");inList=false;} out.push("<p style='margin:10px 0 4px'>" + l + "</p>"); continue; }
    if (l.substring(0,2) === "- " || l.substring(0,2) === "* ") {
      if (!inList) { out.push("<ul style='margin:4px 0 4px 16px;padding:0'>"); inList = true; }
      out.push("<li style='margin:3px 0'>" + l.substring(2) + "</li>"); continue;
    }
    if (inList) { out.push("</ul>"); inList = false; }
    if (l.substring(0,3) === "---") { out.push("<hr style='border:none;border-top:1px solid var(--border);margin:12px 0'>"); continue; }
    if (l.trim() === "") { out.push("<div style='height:6px'></div>"); continue; }
    out.push("<p style='margin:2px 0'>" + l + "</p>");
  }
  if (inList) out.push("</ul>");
  return out.join("");
}
function showMsg(id, txt, color) {
  var el = document.getElementById(id);
  el.textContent = txt; el.style.display = 'block'; el.style.color = color||'var(--accent)';
  setTimeout(function(){ el.style.display='none'; }, 3500);
}

// ── LocalStorage ──────────────────────────────────────────────────────────────
function localKey() { return 'rmr3_' + getMesChave(); }
function saveLocal() {
  localStorage.setItem(localKey(), JSON.stringify({
    agentes: agentes, extras: extras, aiAnalysis: aiAnalysis,
    diasUteis: getDU(), tpvClientes: tpvClientes
  }));
}
function loadLocal() {
  var d = localStorage.getItem(localKey());
  if (d) {
    var p = JSON.parse(d);
    agentes = p.agentes || []; extras = p.extras || {}; aiAnalysis = p.aiAnalysis || '';
    tpvClientes = p.tpvClientes || {};
    document.getElementById('dias-uteis').value = p.diasUteis || 22;
    return true;
  }
  agentes = []; extras = {}; aiAnalysis = ''; tpvClientes = {};
  return false;
}

// ── Supabase Import ───────────────────────────────────────────────────────────
async function importarDoSupabase() {
  var btn = document.querySelector('.btn-import');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Carregando...';
  try {
    var chave = getMesChave();
    var res = await sb.from('dados').select('valor').eq('id', 'mes_'+chave+'_agentes').single();
    if (res.error || !res.data) {
      alert('Não encontrei dados para ' + getMesLabel() + ' no Dash de Metas.\nVerifique se o mês existe lá.');
      return;
    }
    agentes = res.data.valor || [];
    agentes.forEach(function(ag) {
      if (!extras[ag.id]) extras[ag.id] = { propostas:'', tarefasTotais:'', tarefasVendas:'', td:'', reunioes:'' };
    });
    saveLocal();
    renderAll();
  } catch(e) {
    alert('Erro ao conectar: ' + e.message);
  } finally {
    btn.disabled = false; btn.innerHTML = '&#8635; Importar do Dash de Metas';
  }
}

// ── Score cálculo ─────────────────────────────────────────────────────────────
function calcScore(ag) {
  var r = ag.realizado || {};
  var naA    = ag.naMeta    > 0 ? (r.na    ||0) / ag.naMeta    * 100 : 0;
  var tpvA   = ag.tpvMeta   > 0 ? Math.min((r.tpv||0) / ag.tpvMeta  * 100, 150) : 0;
  var churnA = (r.churn     ||0) > 0 ? ag.churnMeta / r.churn * 100 : 0;
  var pNA = (ag.pesoNA??30)/100, pTPV = (ag.pesoTPV??40)/100, pChurn = (ag.pesoChurn??30)/100;
  var bonus = (r.bonus||0)>0 && naA>0 ? (r.bonus * naA * 0.25) * pNA : 0;
  return { naA, tpvA, churnA, score: naA*pNA + tpvA*pTPV + churnA*pChurn + bonus };
}

// ── TPV Clientes: parse Excel ─────────────────────────────────────────────────
function parseTpvExcel(file, agId, callback) {
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      // Parse TSV/CSV simples ou tenta decodificar como texto
      var text = e.target.result;
      var rows = text.split('\n').map(function(r){ return r.split('\t'); });
      // Detecta cabeçalho: busca coluna "Cliente", "TPV M1", "TPV Precificado"
      var header = rows[0].map(function(h){ return h.trim().toLowerCase(); });
      var iCliente = header.findIndex(function(h){ return h.includes('cliente'); });
      var iReal    = header.findIndex(function(h){ return h.includes('tpv m1') || (h.includes('tpv') && h.includes('m1')); });
      var iPrec    = header.findIndex(function(h){ return h.includes('precificado'); });
      if (iCliente < 0 || iReal < 0 || iPrec < 0) {
        alert('Formato não reconhecido. Certifique-se que o arquivo tem colunas: Cliente, TPV M1, TPV Precificado');
        return;
      }
      var clientes = [];
      for (var i = 1; i < rows.length; i++) {
        var row = rows[i];
        if (!row || !row[iCliente] || row[iCliente].trim() === '') continue;
        var nome = row[iCliente].trim();
        var real = parseFloat((row[iReal]||'0').replace(/[^\d,.-]/g,'').replace(',','.')) || 0;
        var prec = parseFloat((row[iPrec]||'0').replace(/[^\d,.-]/g,'').replace(',','.')) || 0;
        if (prec > 0) clientes.push({ nome: nome, realizado: real, precificado: prec });
      }
      callback(clientes);
    } catch(err) {
      alert('Erro ao processar arquivo: ' + err.message);
    }
  };
  reader.readAsText(file, 'UTF-8');
}

// Converte xlsx via FileReader binário + SheetJS (se disponível) ou fallback TSV
function processarArquivoTpv(file, agId) {
  // Tenta como texto primeiro (funciona para CSV/TSV exportado do BI)
  var reader = new FileReader();
  reader.onload = function(e) {
    var text = e.target.result;
    // Remove BOM
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    // Detecta separador
    var sep = text.indexOf('\t') > -1 ? '\t' : ',';
    var rows = text.split('\n').map(function(r){ return r.split(sep).map(function(c){ return c.trim().replace(/^"|"$/g,''); }); });
    var header = rows[0].map(function(h){ return h.toLowerCase(); });
    var iCliente = header.findIndex(function(h){ return h === 'cliente'; });
    var iReal    = header.findIndex(function(h){ return h === 'tpv m1'; });
    var iPrec    = header.findIndex(function(h){ return h === 'tpv precificado'; });

    if (iCliente < 0 || iReal < 0 || iPrec < 0) {
      alert('Colunas não encontradas.\nEsperado: Cliente | TPV M1 | TPV Precificado\nEncontrado: ' + header.join(' | '));
      return;
    }

    var clientes = [];
    for (var i = 1; i < rows.length; i++) {
      var row = rows[i];
      if (!row[iCliente] || row[iCliente] === '') continue;
      // Ignora linhas de filtro ("Filtros aplicados")
      if (row[iCliente].toLowerCase().includes('filtro')) continue;
      var real = parseFloat((row[iReal]||'').replace(',','.')) || 0;
      var prec = parseFloat((row[iPrec]||'').replace(',','.')) || 0;
      if (prec > 0) clientes.push({ nome: row[iCliente], realizado: real, precificado: prec });
    }

    if (clientes.length === 0) {
      alert('Nenhum cliente encontrado no arquivo. Verifique se é o export correto do BI Stone.');
      return;
    }

    tpvClientes[agId] = clientes;
    saveLocal();
    // Re-render só a seção TPV desse agente
    renderTpvSection(agId);
  };
  reader.readAsText(file, 'UTF-8');
}

// ── TPV Section render ────────────────────────────────────────────────────────
function tpvStatusColor(pct) {
  if (pct >= 70)  return 'var(--accent)';
  if (pct > 0)    return 'var(--yellow)';
  return 'var(--red)';
}
function tpvStatusLabel(pct) {
  if (pct >= 70)  return '✓';
  if (pct > 0)    return '~';
  return '✗';
}

function buildTpvSectionHtml(agId) {
  var clientes = tpvClientes[agId] || [];
  var hasData  = clientes.length > 0;

  // Summary stats
  var totalReal = 0, totalPrec = 0, nBom = 0, nAtencao = 0, nZero = 0;
  if (hasData) {
    clientes.forEach(function(c) {
      totalReal += c.realizado; totalPrec += c.precificado;
      var pct = c.precificado > 0 ? (c.realizado / c.precificado * 100) : 0;
      if (pct >= 70) nBom++;
      else if (pct > 0) nAtencao++;
      else nZero++;
    });
  }
  var geralPct = totalPrec > 0 ? (totalReal / totalPrec * 100) : 0;
  var geralColor = tpvStatusColor(geralPct);

  // Sort: bom → atenção → zero, dentro de cada grupo por % desc
  var sorted = hasData ? clientes.slice().sort(function(a,b){
    var pA = a.precificado > 0 ? a.realizado/a.precificado : 0;
    var pB = b.precificado > 0 ? b.realizado/b.precificado : 0;
    return pB - pA;
  }) : [];

  var tableRows = sorted.map(function(c) {
    var pct = c.precificado > 0 ? (c.realizado / c.precificado * 100) : 0;
    var color = tpvStatusColor(pct);
    var barW  = Math.min(pct, 100);
    return '<tr>'+
      '<td>'+
        '<div class="tpv-name">'+esc(c.nome)+'</div>'+
        '<div class="tpv-mini-bar" style="width:'+barW+'%;background:'+color+'"></div>'+
      '</td>'+
      '<td>'+fmtBRL(c.precificado)+'</td>'+
      '<td style="color:'+(c.realizado>0?'var(--text)':'var(--red)')+'">'+fmtBRL(c.realizado)+'</td>'+
      '<td><span style="color:'+color+';font-weight:700">'+pct.toFixed(0)+'%</span></td>'+
    '</tr>';
  }).join('');

  var geralRow = hasData ? '<tr class="tpv-geral-row">'+
    '<td>TOTAL</td>'+
    '<td>'+fmtBRL(totalPrec)+'</td>'+
    '<td>'+fmtBRL(totalReal)+'</td>'+
    '<td><span style="color:'+geralColor+';font-weight:700">'+geralPct.toFixed(0)+'%</span></td>'+
  '</tr>' : '';

  return '<div class="tpv-summary-pills">'+
    (hasData ? [
      '<div class="tpv-pill"><div class="tpv-pill-dot" style="background:var(--accent)"></div>'+nBom+' bom (70%+)</div>',
      '<div class="tpv-pill"><div class="tpv-pill-dot" style="background:var(--yellow)"></div>'+nAtencao+' atenção</div>',
      '<div class="tpv-pill"><div class="tpv-pill-dot" style="background:var(--red)"></div>'+nZero+' zero</div>',
      '<div class="tpv-pill" style="margin-left:auto"><span style="color:'+geralColor+';font-weight:800">'+geralPct.toFixed(0)+'%</span>&nbsp;geral</div>'
    ].join('') : '<span style="font-size:12px;color:var(--muted)">Nenhum arquivo carregado</span>')+
  '</div>'+
  (hasData ? '<table class="tpv-table">'+
    '<thead><tr><th>Cliente</th><th>Precificado</th><th>Realizado M-1</th><th>%</th></tr></thead>'+
    '<tbody>'+tableRows+geralRow+'</tbody>'+
  '</table>' : '')+
  '<div class="tpv-upload-area" id="tpv-upload-'+agId+'">'+
    '<p>'+(hasData ? '&#8635; Substituir arquivo' : '&#128196; Importar export do BI Stone')+' &mdash; CSV ou XLSX (colunas: Cliente, TPV M1, TPV Precificado)</p>'+
    '<label class="btn btn-secondary" style="cursor:pointer;display:inline-flex">'+
      '&#128228; Carregar arquivo'+
      '<input type="file" class="tpv-file-input" accept=".csv,.tsv,.xlsx,.xls" onchange="handleTpvFile(event,\''+agId+'\')" />'+
    '</label>'+
    (hasData ? '&nbsp;<button class="btn btn-secondary" style="color:var(--red)" onclick="limparTpv(\''+agId+'\')">&#10005; Remover</button>' : '')+
  '</div>';
}

function renderTpvSection(agId) {
  var body = document.getElementById('tpv-body-'+agId);
  if (!body) return;
  body.innerHTML = buildTpvSectionHtml(agId);
  // Atualiza chip no toggle
  var chip = document.getElementById('tpv-chip-'+agId);
  var clientes = tpvClientes[agId] || [];
  if (chip) {
    if (clientes.length > 0) {
      var totalReal = clientes.reduce(function(s,c){return s+c.realizado;},0);
      var totalPrec = clientes.reduce(function(s,c){return s+c.precificado;},0);
      var pct = totalPrec > 0 ? (totalReal/totalPrec*100) : 0;
      var color = tpvStatusColor(pct);
      chip.innerHTML = '<span style="color:'+color+';font-weight:800">'+pct.toFixed(0)+'%</span> &middot; '+clientes.length+' clientes';
      chip.style.display = '';
    } else {
      chip.style.display = 'none';
    }
  }
}

function handleTpvFile(event, agId) {
  var file = event.target.files[0];
  if (!file) return;
  processarArquivoTpv(file, agId);
}

function limparTpv(agId) {
  delete tpvClientes[agId];
  saveLocal();
  renderTpvSection(agId);
}

function toggleTpv(agId) {
  var body = document.getElementById('tpv-body-'+agId);
  if (!body) return;
  var isOpen = body.classList.contains('open');
  body.classList.toggle('open');
  var btn = document.getElementById('tpv-btn-'+agId);
  if (btn) btn.textContent = isOpen ? 'Ver' : 'Fechar';
}

function renderSummary() {
  var sc = document.getElementById('summary-card');
  if (!agentes.length) { sc.style.display='none'; return; }
  sc.style.display = '';
  var scores = agentes.map(function(ag){ return calcScore(ag).score; });
  var avg = scores.reduce(function(s,v){return s+v;},0) / scores.length;
  var hit = scores.filter(function(s){return s>=100;}).length;
  var grid = document.getElementById('summary-grid');
  grid.innerHTML =
    stat('Média do time', avg.toFixed(1)+'%', '', scoreColor(avg)) +
    stat('Score máx.', Math.max.apply(null,scores).toFixed(1)+'%', '', 'c-green') +
    stat('Score mín.', Math.min.apply(null,scores).toFixed(1)+'%', '', scoreColor(Math.min.apply(null,scores))) +
    stat('Bateram 100%', hit+'/'+agentes.length, 'agentes', hit===agentes.length?'c-green':hit===0?'c-red':'c-yellow');
}
function stat(label,val,sub,cls){

  var naA = sc.naA, tpvA = sc.tpvA, churnA = sc.churnA;

  var ttTot  = Number(ex.tarefasTotais) || 0;
  var tvTot  = Number(ex.tarefasVendas) || 0;
  var tdTot  = Number(ex.td)            || 0;
  var reTot  = Number(ex.reunioes)      || 0;
  var tpvMed = Number(ex.tpvMedio)      || 0;

  var ppDia = ppTot / du, ttDia = ttTot / du, tvDia = tvTot / du;
  var tdPct = tvTot > 0 ? tdTot / tvTot : 0;

  // TPV clientes chip
  var clientes = tpvClientes[ag.id] || [];
  var tpvChipHtml = '';
  if (clientes.length > 0) {

    tpvChipHtml = '<span id="tpv-chip-'+ag.id+'" style="color:'+tpvStatusColor(pct)+';font-weight:800;font-size:12px">'+pct.toFixed(0)+'% &middot; '+clientes.length+' clientes</span>';
  } else {
    tpvChipHtml = '<span id="tpv-chip-'+ag.id+'" style="display:none"></span>';
  }

  var div = document.createElement('div');
  div.className = 'agent-card';
  div.innerHTML =
    '<div class="agent-header">'+

        '<div class="agent-sub">'+(TRILHAS[ag.trilha]||'')+'</div>'+
      '</div>'+
      '<div class="score-chip '+scoreClass(sc.score)+'">'+sc.score.toFixed(1)+'%</div>'+
    '</div>'+
    '<div class="agent-body">'+
      '<div class="section-label">Metas Oficiais</div>'+

      kpiBarHtml('Churn', ag.churnMeta, r.churn||0, churnA, true, false)+

      extraRowHtml(ag.id,'tpvMedio','TPV M&#233;dio / Credenciado (M0)',tpvMed,tpvMed?fmtBRL(tpvMed):'—',filled(ex,'tpvMedio')?classify(tpvMed,TH.tpvMedio):null,'R$')+
      extraRowHtml(ag.id,'propostas','Propostas',ppTot,filled(ex,'propostas')?ppDia.toFixed(2)+'/dia':'—',filled(ex,'propostas')?classify(ppDia,TH.propostas):null)+
      extraRowHtml(ag.id,'tarefasTotais','Tarefas Totais',ttTot,filled(ex,'tarefasTotais')?ttDia.toFixed(2)+'/dia':'—',filled(ex,'tarefasTotais')?classify(ttDia,TH.tarefasTotais):null)+
      extraRowHtml(ag.id,'tarefasVendas','Tarefas de Vendas',tvTot,filled(ex,'tarefasVendas')?tvDia.toFixed(2)+'/dia':'—',filled(ex,'tarefasVendas')?classify(tvDia,TH.tarefasVendas):null)+
      extraRowHtml(ag.id,'td','TD sim',tdTot,filled(ex,'td')&&tvTot>0?(tdPct*100).toFixed(1)+'% de TDs':'—',filled(ex,'td')&&tvTot>0?classify(tdPct,TH.td):null)+
      extraRowHtml(ag.id,'reunioes','Reuniões Agendadas',reTot,filled(ex,'reunioes')?reTot+' no mês':'—',filled(ex,'reunioes')?classify(reTot,TH.reunioes):null)+
    '</div>'+

        tpvChipHtml+
      '</div>'+
      '<button id="tpv-btn-'+ag.id+'" class="btn btn-secondary" style="padding:5px 12px;font-size:12px;pointer-events:none">Ver</button>'+
    '</div>'+

function updateExtra(agId, field, value) {
  if (!extras[agId]) extras[agId] = {};
  extras[agId][field] = value;
  saveLocal();

  var du  = getDU();
  var ex  = extras[agId];

  function patch(f, rateStr, status) {
    var rEl = document.getElementById('rate-'+agId+'-'+f);
    var bEl = document.getElementById('badge-'+agId+'-'+f);
    if (rEl) rEl.textContent = rateStr;
    if (bEl) { bEl.outerHTML = badgeHtml(status,'badge-'+agId+'-'+f); }
  }

  var pp = Number(ex.propostas)||0,     ppDia = pp/du;
  var tt = Number(ex.tarefasTotais)||0, ttDia = tt/du;
  var tvN = Number(ex.tarefasVendas)||0, tvDia = tvN/du;
  var td = Number(ex.td)||0,            tdPct = tvN>0?td/tvN:0;
  var re = Number(ex.reunioes)||0;
  var tm = Number(ex.tpvMedio)||0;

  patch('tpvMedio',      filled(ex,'tpvMedio')       ? fmtBRL(tm)                       : '—', filled(ex,'tpvMedio')             ? classify(tm,   TH.tpvMedio)       : null);
  patch('propostas',     filled(ex,'propostas')      ? ppDia.toFixed(2)+'/dia'           : '—', filled(ex,'propostas')            ? classify(ppDia,TH.propostas)       : null);
  patch('tarefasTotais', filled(ex,'tarefasTotais')  ? ttDia.toFixed(2)+'/dia'           : '—', filled(ex,'tarefasTotais')        ? classify(ttDia,TH.tarefasTotais)   : null);
  patch('tarefasVendas', filled(ex,'tarefasVendas')  ? tvDia.toFixed(2)+'/dia'           : '—', filled(ex,'tarefasVendas')        ? classify(tvDia,TH.tarefasVendas)   : null);
  patch('td',            filled(ex,'td')&&tvN>0      ? (tdPct*100).toFixed(1)+'% de TDs' : '—', filled(ex,'td')&&tvN>0           ? classify(tdPct,TH.td)               : null);
  patch('reunioes',      filled(ex,'reunioes')       ? re+' no mês'                      : '—', filled(ex,'reunioes')            ? classify(re,   TH.reunioes)         : null);
}

function buildPrompt() {

  var du = getDU(), ml = getMesLabel();
  var scores = agentes.map(function(ag){ return calcScore(ag).score; });
  var avgScore = (scores.reduce(function(s,v){return s+v;},0)/scores.length).toFixed(1);

  var lines = agentes.map(function(ag) {
    var r  = ag.realizado || {};
    var ex = extras[ag.id] || {};
    var sc = calcScore(ag);

    var pp = Number(ex.propostas)||0,     ppDia = pp/du;
    var tt = Number(ex.tarefasTotais)||0, ttDia = tt/du;
    var tv = Number(ex.tarefasVendas)||0, tvDia = tv/du;
    var td = Number(ex.td)||0,            tdPct = tv>0?(td/tv*100).toFixed(1)+'%':'—';
    var re = Number(ex.reunioes)||0;
    var tpvMed = Number(ex.tpvMedio) || 0;

    function st(val, th) { var s = classify(val,th); return s==='otimo'?'Ótimo':s==='bom'?'Bom':'Ruim'; }

    return '--- '+ag.nome+' (Score: '+sc.score.toFixed(1)+'%) ---\n'+
      'Metas Oficiais:\n'+
      '  NA: '+( r.na||0)+'/'+ag.naMeta+' → '+sc.naA.toFixed(1)+'%\n'+
      '  TPV M1: R$'+(r.tpv||0).toLocaleString('pt-BR')+'/R$'+ag.tpvMeta.toLocaleString('pt-BR')+' → '+sc.tpvA.toFixed(1)+'%\n'+
      '  Churn: '+(r.churn||0)+'%/'+ag.churnMeta+'% → '+sc.churnA.toFixed(1)+'%\n'+
      '  TPV Médio/Cred: R$'+tpvMed.toLocaleString('pt-BR')+(tpvMed>0?' ('+st(tpvMed,TH.tpvMedio)+')':'')+'\n'+
      'Atividade ('+du+' dias úteis):\n'+
      '  Propostas: '+pp+' total → '+ppDia.toFixed(2)+'/dia'+(pp?' ('+st(ppDia,TH.propostas)+')':' (sem dado)')+'\n'+
      '  Tarefas Totais: '+tt+' total → '+ttDia.toFixed(2)+'/dia'+(tt?' ('+st(ttDia,TH.tarefasTotais)+')':' (sem dado)')+'\n'+
      '  Tarefas de Vendas: '+tv+' total → '+tvDia.toFixed(2)+'/dia'+(tv?' ('+st(tvDia,TH.tarefasVendas)+')':' (sem dado)')+'\n'+
      '  TD sim: '+td+' → '+tdPct+' de tarefas de vendas'+(td&&tv?' ('+st(td/Math.max(tv,1),TH.td)+')':' (sem dado)')+'\n'+
      '  Reuniões Agendadas: '+re+(re?' ('+st(re,TH.reunioes)+')':' (sem dado)');
  }).join('\n\n');

  return 'Você é um especialista em gestão comercial e coaching de equipes de vendas da Stone.\n\n'+
    'Analise os resultados da Reunião Mensal de Resultado (RMR) e gere um relatório completo.\n\n'+
    'Mês: '+ml+'\nDias úteis: '+du+'\nAgentes: '+agentes.length+'\nMédia de score: '+avgScore+'%\n\n'+
    'RESULTADOS INDIVIDUAIS:\n\n'+lines+'\n\n'+
    'Gere um relatório com:\n\n'+
    '1. **Panorama Geral**\n2. **Pontos Fortes**\n3. **Pontos de Melhoria**\n4. **Ações Recomendadas**\n5. **Mensagem para a Turma**\n\n'+
    'Linguagem: direta, objetiva, respeitosa.';
}

// ── Per-agent AI section ──────────────────────────────────────────────────────

  var hasAnalysis = savedAnalysis && savedAnalysis.trim();
  return '<div class="agent-ai-toggle">'+
    '<span style="font-size:12px;color:var(--muted)">&#10024; An&#225;lise Individual</span>'+
    '<div style="display:flex;gap:8px;align-items:center">'+
      (hasAnalysis?'<span class="badge badge-green">An&#225;lise salva</span>':'')+
      '<button class="btn btn-secondary" style="padding:5px 12px;font-size:12px" onclick="toggleAnalysis(\''+agId+'\')">Abrir</button>'+
    '</div>'+
  '</div>'+
  '<div class="agent-ai-body" id="ai-body-'+agId+'">'+
    '<div class="step-box" style="margin-bottom:10px">'+
      '<div class="step-num">Passo 1 — Copiar prompt e colar no claude.ai</div>'+
      '<button class="btn btn-primary" style="margin-top:8px" onclick="copyPromptAgent(\''+agId+'\')">&#128203; Copiar Prompt de '+esc(agNome)+'</button>'+
      '<div class="info-msg" id="ok-'+agId+'" style="display:none"></div>'+
    '</div>'+
    '<div class="step-box" style="margin-bottom:10px">'+
      '<div class="step-num">Passo 2 — Cole o HTML gerado pelo Claude aqui</div>'+
      '<textarea id="paste-'+agId+'" style="margin-top:8px;font-size:11px;font-family:monospace" placeholder="Cole aqui o HTML gerado pelo claude.ai..."></textarea>'+
      '<div class="btn-row" style="margin-top:8px">'+
        '<button class="btn btn-primary" onclick="saveAgentAnalysis(\''+agId+'\')">&#10003; Salvar</button>'+
        '<button class="btn btn-secondary" onclick="clearAgentAnalysis(\''+agId+'\')">Limpar</button>'+
      '</div>'+
    '</div>'+
    '<div id="saved-wrap-'+agId+'" style="'+(hasAnalysis?'':'display:none')+'">'+
      '<div class="btn-row" style="margin-top:0;padding:0 0 12px">'+
        '<button class="btn btn-primary" onclick="savePdfReport(\''+agId+'\')">&#128196; Salvar PDF</button>'+
        '<button class="btn btn-secondary" onclick="openHtmlReport(\''+agId+'\')">&#128065; Visualizar</button>'+
        '<button class="btn btn-secondary" onclick="clearAgentAnalysis(\''+agId+'\')">&#10005; Remover</button>'+
      '</div>'+
    '</div>'+
    '<div class="step-box" style="margin-top:10px;margin-bottom:0">'+
      '<div class="step-num">Meta do M&#234;s &mdash; sai na &#250;ltima folha do PDF</div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px">'+
        '<div><div style="font-size:11px;color:var(--muted);margin-bottom:4px">NA</div>'+
          '<input type="number" id="meta-na-'+agId+'" class="kpi-input" style="width:100%" placeholder="Ex: 12" value="'+esc((extras[agId]||{}).metaNA||'')+'" oninput="saveMetaCampos(\''+agId+'\')"/></div>'+
        '<div><div style="font-size:11px;color:var(--muted);margin-bottom:4px">TPV M1 (R$)</div>'+
          '<input type="number" id="meta-tpv-'+agId+'" class="kpi-input" style="width:100%" placeholder="Ex: 250000" value="'+esc((extras[agId]||{}).metaTPV||'')+'" oninput="saveMetaCampos(\''+agId+'\')"/></div>'+
        '<div><div style="font-size:11px;color:var(--muted);margin-bottom:4px">Churn (%)</div>'+
          '<input type="number" id="meta-churn-'+agId+'" class="kpi-input" style="width:100%" placeholder="Ex: 5.5" step="0.1" value="'+esc((extras[agId]||{}).metaChurn||'')+'" oninput="saveMetaCampos(\''+agId+'\')"/></div>'+
      '</div>'+
    '</div>'+
  '</div>';
}

function proxMesLabel() {
  var m = parseInt(document.getElementById('month-select').value);
  var y = parseInt(document.getElementById('year-select').value);
  var d = new Date(y, m, 1);
  return MESES[d.getMonth()] + ' / ' + d.getFullYear();
}

function saveMetaCampos(agId) {
  if (!extras[agId]) extras[agId] = {};
  var na    = document.getElementById('meta-na-'+agId);
  var tpv   = document.getElementById('meta-tpv-'+agId);
  var churn = document.getElementById('meta-churn-'+agId);
  extras[agId].metaNA    = na    ? na.value    : '';
  extras[agId].metaTPV   = tpv   ? tpv.value   : '';
  extras[agId].metaChurn = churn ? churn.value  : '';
  saveLocal();
}

function toggleAnalysis(agId) {
  var body = document.getElementById('ai-body-'+agId);
  var isOpen = body.classList.contains('open');
  body.classList.toggle('open');
  var btn = body.previousElementSibling.querySelector('button');
  if (btn) btn.textContent = isOpen ? 'Abrir' : 'Fechar';
}

function buildAgentPrompt(ag) {
  var r  = ag.realizado || {};
  var ex = extras[ag.id] || {};
  var du = getDU(), ml = getMesLabel();
  var sc = calcScore(ag);

  var pp = Number(ex.propostas)||0,     ppDia = pp/du;
  var tt = Number(ex.tarefasTotais)||0, ttDia = tt/du;
  var tv = Number(ex.tarefasVendas)||0, tvDia = tv/du;
  var td = Number(ex.td)||0,            tdPct = tv>0?td/tv:0;
  var re = Number(ex.reunioes)||0;
  var tm = Number(ex.tpvMedio)||0;

  // TPV clientes
  var clientes = tpvClientes[ag.id] || [];
  var tpvClientesStr = '';
  if (clientes.length > 0) {
    var totalReal = clientes.reduce(function(s,c){return s+c.realizado;},0);
    var totalPrec = clientes.reduce(function(s,c){return s+c.precificado;},0);
    var geralPct  = totalPrec > 0 ? (totalReal/totalPrec*100) : 0;
    var nBom = clientes.filter(function(c){ return c.precificado>0 && c.realizado/c.precificado>=0.7; }).length;
    var nZero= clientes.filter(function(c){ return c.realizado===0; }).length;
    var criticos = clientes.filter(function(c){ return c.realizado===0 || (c.precificado>0 && c.realizado/c.precificado<0.7); })
      .sort(function(a,b){ return b.precificado - a.precificado; }).slice(0,5);
    tpvClientesStr = '\nPERFORMANCE TPV M-1 POR CLIENTE:\n'+
      '  Geral: '+geralPct.toFixed(0)+'% ('+fmtBRL(totalReal)+' / '+fmtBRL(totalPrec)+')\n'+
      '  Bons (70%+): '+nBom+' | Zero: '+nZero+' | Total: '+clientes.length+'\n'+
      '  Críticos (sem TPV ou <70%):\n'+
      criticos.map(function(c){
        var pct = c.precificado>0?(c.realizado/c.precificado*100):0;
        return '    - '+c.nome+': '+pct.toFixed(0)+'% (real: '+fmtBRL(c.realizado)+' / prec: '+fmtBRL(c.precificado)+')';
      }).join('\n');
  }

  function st(val, th) { var s=classify(val,th); return s==='otimo'?'Ótimo':s==='bom'?'Bom':'Ruim'; }

  return 'Você é um especialista em gestão comercial e coaching de equipes de vendas da Stone.\n\n'+
    'Faça a análise individual de RMR (Reunião Mensal de Resultado) do agente abaixo.\n\n'+
    'Agente: '+ag.nome+'\nMês: '+ml+'\nDias úteis: '+du+'\nTrilha: '+(TRILHAS[ag.trilha]||'')+'\n\n'+
    'METAS OFICIAIS:\n'+
    '  NA: '+(r.na||0)+'/'+ag.naMeta+' → '+sc.naA.toFixed(1)+'%\n'+
    '  TPV M1: R$'+(r.tpv||0).toLocaleString('pt-BR')+'/R$'+ag.tpvMeta.toLocaleString('pt-BR')+' → '+sc.tpvA.toFixed(1)+'%\n'+
    '  Churn: '+(r.churn||0)+'%/'+ag.churnMeta+'% → '+sc.churnA.toFixed(1)+'%\n'+
    '  Score geral: '+sc.score.toFixed(1)+'%\n'+
    '  TPV Médio/Cred (M0): '+(tm?fmtBRL(tm)+' ('+st(tm,TH.tpvMedio)+')':'não informado')+'\n\n'+
    'ATIVIDADE ('+du+' dias úteis):\n'+
    '  Propostas: '+pp+' total → '+ppDia.toFixed(2)+'/dia'+(pp?' ('+st(ppDia,TH.propostas)+')':' (sem dado)')+'\n'+
    '  Tarefas Totais: '+tt+' → '+ttDia.toFixed(2)+'/dia'+(tt?' ('+st(ttDia,TH.tarefasTotais)+')':' (sem dado)')+'\n'+
    '  Tarefas de Vendas: '+tv+' → '+tvDia.toFixed(2)+'/dia'+(tv?' ('+st(tvDia,TH.tarefasVendas)+')':' (sem dado)')+'\n'+
    '  TD: '+td+(td&&tv?' → '+(tdPct*100).toFixed(1)+'% das tarefas de vendas ('+st(tdPct,TH.td)+')':' (sem dado)')+'\n'+
    '  Reuniões: '+re+(re?' ('+st(re,TH.reunioes)+')':' (sem dado)')+
    tpvClientesStr+'\n\n'+
    'ATENÇÃO: O indicador TD deve aparecer como "TD sim". NUNCA "TVs".\n\n'+
    'FORMATO DE SAÍDA: Gere um arquivo HTML completo e auto-contido (único arquivo, com CSS inline no <style>, sem dependências externas exceto Google Fonts). NÃO use markdown — gere apenas HTML.\n\n'+
    'Design do HTML:\n'+
    '- Fundo claro (#f5f4f0), tipografia limpa com Google Fonts (Syne para títulos, Inter para corpo, JetBrains Mono para dados)\n'+
    '- Header com nome do agente em destaque, score geral e data\n'+
    '- Grid de cards para os KPIs oficiais (verde/amarelo/vermelho conforme status)\n'+
    '- Tabela de atividade com barras de progresso e pills de status\n'+(clientes.length>0?
    '- Seção de Performance TPV M-1 por Cliente: tabela com todos os clientes, barra mini por linha, pills de resumo (bons/atenção/zero) e destaque visual nos clientes críticos\n':'')+
    '- Seções numeradas (01, 02...) para a análise\n'+
    '- Seção de feedback final com fundo escuro\n'+
    '- Animações suaves de entrada (fadeUp)\n'+
    '- Responsivo para mobile\n\n'+
    'Conteúdo das seções:\n'+
    '1. Resultado do Mês\n'+
    '2. Pontos Fortes — com O QUE FAZER PARA MANTER\n'+
    '3. Pontos de Melhoria — gap em número, causa provável, ação específica\n'+(clientes.length>0?
    '4. Clientes Críticos — análise dos clientes com TPV zero ou <70% do precificado, com ação específica para cada um\n'+
    '5. Plano de Ação — 3 ações com meta numérica\n'+
    '6. Feedback Direto — mensagem pessoal. Use o nome do agente.\n':
    '4. Plano de Ação — 3 ações com meta numérica\n'+
    '5. Feedback Direto — mensagem pessoal. Use o nome do agente.\n')+
    'Linguagem: direta, objetiva, respeitosa. Use os dados como base.';
}

function copyPromptAgent(agId) {
  var ag = agentes.find(function(a){ return a.id===agId; });
  if (!ag) return;
  var p = buildAgentPrompt(ag);
  navigator.clipboard.writeText(p).then(function(){
    showMsg('ok-'+agId, '✓ Prompt copiado! Cole no claude.ai', 'var(--accent)');
  }).catch(function(){
    showMsg('ok-'+agId, 'Erro ao copiar — tente novamente', 'var(--red)');
  });
}

function saveAgentAnalysis(agId) {
  var el = document.getElementById('paste-'+agId);
  if (!el || !el.value.trim()) return;
  if (!extras[agId]) extras[agId] = {};
  extras[agId].aiAnalysis = el.value.trim();
  saveLocal();
  el.value = '';
  var wrap = document.getElementById('saved-wrap-'+agId);
  if (wrap) wrap.style.display = '';
}

function clearAgentAnalysis(agId) {
  if (!extras[agId]) return;
  extras[agId].aiAnalysis = '';
  saveLocal();
  var wrap = document.getElementById('saved-wrap-'+agId);
  if (wrap) wrap.style.display = 'none';
}

function openHtmlReport(agId) {
  var html = (extras[agId] || {}).aiAnalysis || '';
  if (!html) return;
  var blob = new Blob([html], {type: 'text/html; charset=utf-8'});
  window.open(URL.createObjectURL(blob), '_blank');
}

function savePdfReport(agId) {
  var html = (extras[agId] || {}).aiAnalysis || '';
  if (!html) return;
  var ag = agentes.find(function(a){ return a.id===agId; });
  var nome = ag ? ag.nome : '';
  var ex      = extras[agId] || {};
  var metaNA    = (document.getElementById('meta-na-'+agId)    || {value: ex.metaNA    ||''}).value.trim();
  var metaTPV   = (document.getElementById('meta-tpv-'+agId)   || {value: ex.metaTPV   ||''}).value.trim();
  var metaChurn = (document.getElementById('meta-churn-'+agId) || {value: ex.metaChurn ||''}).value.trim();
  var proxLabel = proxMesLabel();
  var temMeta   = metaNA || metaTPV || metaChurn;

  function metaCard(label, value, unit) {
    var display = value ? (unit === 'R$' ? 'R$ '+Number(value).toLocaleString('pt-BR') : value+(unit||'')) : '—';
    return '<div style="background:#fff;border:1px solid #e2e0d8;padding:28px 24px;text-align:center">'+
      '<div style="font-family:JetBrains Mono,monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#a8a69e;margin-bottom:10px">'+label+'</div>'+
      '<div style="font-family:Syne,sans-serif;font-size:32px;font-weight:800;color:'+(value?'#00a651':'#c8c5b8')+';line-height:1">'+display+'</div>'+
    '</div>';
  }

  var metaSection = '';
  if (temMeta) {
    metaSection =
      '<div style="page-break-before:always;padding:56px 40px 100px;font-family:Inter,sans-serif;max-width:900px;margin:0 auto;background:#f5f4f0;min-height:100vh">'+
        '<div style="font-family:JetBrains Mono,monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#a8a69e;margin-bottom:14px">// Compromisso do M&ecirc;s</div>'+
        '<div style="font-family:Syne,sans-serif;font-size:40px;font-weight:800;color:#0f0f0d;line-height:1;letter-spacing:-.02em;margin-bottom:6px">Meta</div>'+
        '<div style="font-family:Syne,sans-serif;font-size:40px;font-weight:800;color:#00a651;line-height:1;letter-spacing:-.02em;margin-bottom:48px">do M&#234;s</div>'+
        '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-bottom:48px">'+
          metaCard('NA', metaNA, '')+metaCard('TPV M1', metaTPV, 'R$')+metaCard('Churn', metaChurn, '%')+
        '</div>'+
        '<div style="padding-top:24px;border-top:1px solid #e2e0d8;display:flex;justify-content:space-between;font-family:JetBrains Mono,monospace;font-size:10px;color:#a8a69e;letter-spacing:.06em">'+
          '<span>RMR Individual &middot; '+esc(nome)+'</span><span>'+proxLabel+'</span>'+
        '</div>'+
      '</div>';
  }

  var inject = '<script>window.onload=function(){setTimeout(function(){window.print();},400);}<\/script>';
  var printHtml = html;
  if (metaSection) printHtml = printHtml.includes('</body>') ? printHtml.replace('</body>', metaSection+'</body>') : printHtml + metaSection;
  printHtml = printHtml.includes('</body>') ? printHtml.replace('</body>', inject+'</body>') : printHtml + inject;

  var blob = new Blob([printHtml], {type: 'text/html; charset=utf-8'});
  window.open(URL.createObjectURL(blob), '_blank');
}

// ── Export ────────────────────────────────────────────────────────────────────
function openExport() {
  var ml = getMesLabel(), du = getDU();

  var agRows = agentes.map(function(ag) {
    var r  = ag.realizado || {};
    var ex = extras[ag.id] || {};
    var sc = calcScore(ag);
    var pp = Number(ex.propostas)||0, tt = Number(ex.tarefasTotais)||0, tv = Number(ex.tarefasVendas)||0;
    var td = Number(ex.td)||0, re = Number(ex.reunioes)||0;
    var tpvMed = Number(ex.tpvMedio) || 0;

    // TPV clientes resumo
    var clientes = tpvClientes[ag.id] || [];
    var tpvClienteStr = '—';
    if (clientes.length > 0) {
      var tR = clientes.reduce(function(s,c){return s+c.realizado;},0);
      var tP = clientes.reduce(function(s,c){return s+c.precificado;},0);
      tpvClienteStr = tP>0?(tR/tP*100).toFixed(0)+'%':'—';
    }

    function dot(val, th, label) {
      if (!val) return '<span style="color:#999">—</span>';
      var s = classify(val, th);
      return '<span class="dot dot-'+(s==='otimo'?'g':s==='bom'?'y':'r')+'"></span>'+label;
    }

    return '<tr>'+
      '<td style="font-weight:600">'+esc(ag.nome)+'</td>'+
      '<td>'+sc.naA.toFixed(1)+'%</td>'+
      '<td>'+sc.tpvA.toFixed(1)+'%</td>'+
      '<td>'+sc.churnA.toFixed(1)+'%</td>'+
      '<td>'+dot(tpvMed,TH.tpvMedio,fmtBRL(tpvMed))+'</td>'+
      '<td><strong style="font-size:14px">'+sc.score.toFixed(1)+'%</strong></td>'+
      '<td>'+tpvClienteStr+'</td>'+
      '<td>'+dot(pp?(pp/du):0,TH.propostas,pp?(pp/du).toFixed(2)+'/d':'—')+'</td>'+
      '<td>'+dot(tt?(tt/du):0,TH.tarefasTotais,tt?(tt/du).toFixed(2)+'/d':'—')+'</td>'+
      '<td>'+dot(tv?(tv/du):0,TH.tarefasVendas,tv?(tv/du).toFixed(2)+'/d':'—')+'</td>'+
      '<td>'+dot(tv>0?td/tv:0,TH.td,td&&tv?(td/tv*100).toFixed(0)+'%':'—')+'</td>'+
      '<td>'+dot(re,TH.reunioes,re?re:'—')+'</td>'+
    '</tr>';
  }).join('');

  document.getElementById('export-doc').innerHTML =
    '<h2>RMR &mdash; '+ml+'</h2>'+
    '<div class="doc-sub">Stone Barbacena &middot; '+du+' dias úteis &middot; '+new Date().toLocaleDateString('pt-BR')+'</div>'+
    '<h3>Resultados do Time</h3>'+
    '<table>'+
      '<tr><th>Agente</th><th>NA%</th><th>TPV%</th><th>Churn%</th><th>TPV Méd/Cred</th><th>Score</th><th>TPV Cli%</th><th>Propostas</th><th>Trf Total</th><th>Trf Vendas</th><th>TD%</th><th>Reuniões</th></tr>'+
      (agRows||'<tr><td colspan="12" style="text-align:center;color:#999;padding:20px">Sem dados</td></tr>')+
    '</table>'+
    '<p style="font-family:sans-serif;font-size:11px;color:#999;margin-top:6px">&#9679; Verde = Ótimo &nbsp; &#9679; Amarelo = Bom &nbsp; &#9679; Vermelho = Ruim &nbsp; TPV Cli% = realizado/precificado dos clientes</p>'+
    '<div class="doc-footer">RMR Dashboard &middot; Stone Barbacena &middot; '+ml+'</div>';

  document.getElementById('export-preview').classList.add('open');
}

function closeExport() { document.getElementById('export-preview').classList.remove('open'); }

// ── Init ──────────────────────────────────────────────────────────────────────
function init() {
  var now = new Date(), ys = document.getElementById('year-select');
  for (var y = now.getFullYear()-2; y <= now.getFullYear()+1; y++) {
    var o = document.createElement('option');
    o.value = y; o.textContent = y;
    if (y === now.getFullYear()) o.selected = true;
    ys.appendChild(o);
  }
  document.getElementById('month-select').value = now.getMonth()+1;
  document.getElementById('month-select').addEventListener('change', function(){ loadLocal(); renderAll(); updateImportBtn(); });
  document.getElementById('year-select').addEventListener('change',  function(){ loadLocal(); renderAll(); updateImportBtn(); });
  loadLocal();
  renderAll();
  updateImportBtn();
}

function updateImportBtn() {
  var btn = document.getElementById('btn-import');
  if (btn) btn.innerHTML = '&#8635; Importar ' + getMesLabel() + ' do Dash de Metas';
}

init();
</script>
